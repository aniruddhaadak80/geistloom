name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate changelog
        id: changelog
        run: |
          echo "## Geistloom ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "Deterministic superintelligence simulation — the world-frame where aging gets solved." >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
