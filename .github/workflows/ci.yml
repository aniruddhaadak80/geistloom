name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (Next.js 15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build

  core-rust:
    name: Rust century engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo test
        working-directory: crates/loom-engine
        run: cargo test --locked || cargo test

  oracle-python:
    name: Oracle service (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        working-directory: services/oracle
        run: python -m pip install -e ".[dev]"
      - name: Pytest
        working-directory: services/oracle
        run: pytest -q

  relay-go:
    name: Relay daemon (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Go test
        working-directory: services/relay
        run: go test ./...

  scale:
    name: Scale guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Count lines
        run: bun scripts/loc-count.mjs --min-lines 30000

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
