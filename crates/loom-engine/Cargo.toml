[package]
name = "geistloom-loom-engine"
version = "0.1.0"
edition = "2021"
description = "Rust century-engine: RK4 world dynamics + gene-drive population genetics, compiled to wasm for the Geistloom web app."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
wasm-bindgen-test = "0.2"

[profile.release]
opt-level = 3
