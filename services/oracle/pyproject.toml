[project]
name = "geistloom-oracle"
version = "0.1.0"
description = "Deterministic superintelligence simulator for Geistloom — zero API keys, fully auditable reasoning."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27.0"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["oracle_service"]
